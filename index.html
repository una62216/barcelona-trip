<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1c1b1a;--mut:#74706a;--line:#e7e2da;--brand:#ff5a36;--pill:#efeae2;--shadow:0 6px 20px rgba(40,30,20,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--card:#221f1c;--ink:#f3eee8;--mut:#a9a199;--line:#37322d;--pill:#2f2a26;--shadow:0 6px 20px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}
.logo span{color:var(--brand)}
.tabs{display:flex;gap:6px;background:var(--pill);padding:4px;border-radius:99px}
.tabs button{border:0;background:transparent;color:var(--ink);padding:7px 16px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.hotel{margin-left:auto;font-size:13px;color:var(--mut)}
.app{flex:1;display:grid;grid-template-columns:minmax(380px,480px) 1fr;min-height:0}
.side{overflow:auto;padding:16px 18px 40px}
#map{height:100%;min-height:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.plan{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px;border-left:6px solid var(--brand)}
.plan h2{margin:0 0 4px;font-size:18px}
.plan p{margin:4px 0;color:var(--mut);font-size:14px}
.card{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px;margin-bottom:12px;cursor:pointer;border:2px solid transparent;transition:.15s}
.card:hover,.card.sel{border-color:var(--brand)}
.thumb{border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;min-height:96px;position:relative}
.thumb b{position:absolute;top:6px;left:6px;font-size:11px;background:rgba(0,0,0,.35);padding:1px 7px;border-radius:99px}
.card h3{margin:0;font-size:16px}
.card h3 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{font-size:12px;background:var(--pill);padding:1px 9px;border-radius:99px}
.tag.warn{background:#fff2c9;color:#7a5a00}
.tag.ok{background:#d9f2e0;color:#14642d}
.card p{margin:2px 0;font-size:13.5px}
.card .row{font-size:12.5px;color:var(--mut)}
.links{margin-top:4px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px}
.notice{font-size:12.5px;color:var(--mut);margin:14px 0}
.sec{margin:18px 0 6px;font-weight:800;font-size:15px}
#gm{width:100%;flex:1;border:0;min-height:300px}
.mapwrap{display:flex;flex-direction:column;height:100%;min-height:0}
.mbar{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;font-size:13px}
.mbar .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mbar .sp{margin-left:auto;color:var(--mut)}
.plan .rt{display:inline-block;margin-top:6px;font-size:13px;font-weight:700}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:42vh 1fr}#map{order:-1}.hotel{display:none}}
</style>

const side=document.getElementById('side');
let tab=1, dayF=0, anchF='all', curSelKeep=false;

function fixCard(f){
 const col=DAYCOL[f.day-1];
 return `<div class="card" data-id="${f.id}"><div class="thumb" style="background:linear-gradient(135deg,${col},#222a)"><b>${DATES[f.day-1].split(' ')[0]}</b>${f.ic}</div><div>
 <h3>${f.n}<small>${f.en}</small></h3>
 <div class="meta">${f.tags.map(t=>`<span class="tag ok">${t}</span>`).join('')}${(f.warn||[]).map(t=>`<span class="tag warn">⚠️ ${t}</span>`).join('')}</div>
 <p>${f.d}</p><div class="row">🕘 ${f.time}</div><div class="row">🚇 ${f.tr}</div>
 <div class="links"><a target="_blank" rel="noopener" href="${maps(f.en,f.addr)}">📍 地圖</a><a target="_blank" rel="noopener" href="${dir(f.lat,f.lng)}">🧭 從市中心大眾運輸</a>${f.link?`<a target="_blank" rel="noopener" href="${f.link}">🔗 官網</a>`:''}</div></div></div>`;
}
function pickCard(p){
 const col=DAYCOL[(p.day||1)-1];
 return `<div class="card" data-id="${p.id}"><div class="thumb" style="background:linear-gradient(135deg,${col}cc,#222a)">${p.ic}</div><div>
 <h3>${p.n}<small>${p.en}</small></h3>
 <div class="meta"><span class="tag">${p.cat}</span>${p.with.map(w=>`<span class="tag ok">配 ${ANCH[w]}</span>`).join('')}<span class="tag">建議 ${DATES[p.day-1].split(' ')[0]}</span>${p.warn?'<span class="tag warn">⚠️ 請確認營業</span>':''}</div>
 <p>${p.why}</p><div class="row">🚇 ${p.tr}</div>
 <div class="links"><a target="_blank" rel="noopener" href="${maps(p.en,p.addr)}">📍 地圖</a><a target="_blank" rel="noopener" href="${dir(p.lat,p.lng)}">🧭 從市中心大眾運輸</a></div></div></div>`;
}

function render(){
 layer.clearLayers(); mk={};
 let h='',pts=[[HOTEL.lat,HOTEL.lng]];
 if(tab===1){
  h+=`<div class="chips"><button class="chip ${dayF===0?'on':''}" data-d="0">全部</button>${DATES.map((d,i)=>`<button class="chip ${dayF===i+1?'on':''}" data-d="${i+1}">${d}</button>`).join('')}</div>`;
  const days=dayF?[DAYS[dayF-1]]:DAYS;
  for(const D of days){
   h+=`<div class="plan" style="border-left-color:${DAYCOL[D.d-1]}"><h2>Day ${D.d} · ${DATES[D.d-1]}｜${D.t}</h2><p>${D.s}</p>${(()=>{const es=EATS.filter(e=>(DAYAREA[D.d]||[]).includes(e.near)&&e.cat!=='super').slice(0,8);return es.length?`<div class="row" style="margin-top:6px">🍴 當天順路吃喝：${es.map(e=>`<a target="_blank" rel="noopener" href="${maps(e.en,e.addr)}">${e.ic}${e.n.split('（')[0]}</a>`).join(' · ')}</div>`:''})()}${dayRouteUrl(D.d)?`<a class="rt" target="_blank" rel="noopener" href="${dayRouteUrl(D.d)}">🧭 當日大眾運輸路線 / Day route (Google Maps)</a>`:''}</div>`;
   const fx=FIX.filter(f=>f.day===D.d).sort((a,b)=>a.ord-b.ord);
   if(!fx.length) h+=`<div class="notice">今天沒有「確定景點」，建議參考分頁二的搭配。</div>`;
   fx.forEach((f,i)=>{h+=fixCard(f);const m=L.marker([f.lat,f.lng],{icon:pin(DAYCOL[f.day-1],f.day)}).addTo(layer).bindPopup(`<b>${f.n}</b><br>${f.time}`);m.on('click',()=>sel(f.id));mk[f.id]=m;pts.push([f.lat,f.lng]);});
  }
  h+=`<p class="notice">⚠️ 營業時間、票價與班次依官網為準，地圖與路線連結為 Google Maps 大眾運輸導航。圖片以插圖代替，未使用實景照。</p>`;
 }else if(tab===2){
  h+=`<div class="chips"><button class="chip ${anchF==='all'?'on':''}" data-a="all">全部</button>${Object.keys(ANCH).map(k=>`<button class="chip ${anchF===k?'on':''}" data-a="${k}">${ANCH[k]}</button>`).join('')}</div>`;
  h+=`<div class="notice">書本推薦地點（高價位已刪除），告訴你「可以和哪個確定景點一起安排」。粉紅色大標=確定景點；彩色小標=推薦地點（顏色＝建議日）。</div>`;
  const list=PICKS.filter(p=>anchF==='all'||p.with[0]===anchF);
  const keys=Object.keys(ANCH).filter(k=>anchF==='all'||k===anchF||(anchF==='batllo'&&false));
  keys.forEach(k=>{const f=FIX.find(x=>x.id===k); if(f){const m=L.marker([f.lat,f.lng],{icon:pin('#ff3b6b','★')}).addTo(layer).bindPopup(`<b>★ ${f.n}</b>`);mk[f.id]=m;pts.push([f.lat,f.lng]);}
   const items=PICKS.filter(p=>p.with[0]===k); if(!items.length&&!f)return;
   h+=`<div class="sec">★ ${ANCH[k]} 周邊／順路</div>`+(items.map(pickCard).join('')||'<div class="notice">此景點周邊暫無書本推薦。</div>');});
  list.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:pin(DAYCOL[p.day-1],p.ic)}).addTo(layer).bindPopup(`<b>${p.n}</b><br>${p.why}`);m.on('click',()=>sel(p.id));mk[p.id]=m;pts.push([p.lat,p.lng]);});
 }else{
  h+=`<div class="chips">${Object.keys(CATLBL).map(k=>`<button class="chip ${eatC===k?'on':''}" data-c="${k}">${CATLBL[k]}</button>`).join('')}</div>`;
  h+=`<div class="chips"><button class="chip ${eatA==='all'?'on':''}" data-a2="all">全部地區</button>${EAREA_ORDER.map(k=>`<button class="chip ${eatA===k?'on':''}" data-a2="${k}">${AREA[k]}</button>`).join('')}</div>`;
  h+=`<div class="notice">🛒 <b>超市提醒：</b>西班牙週日與國定假日（1/1、1/6）多數超市休息，建議 1/2 或 1/5 先把水、早餐與零食買好。各區內依價位由低到高排序。標 ⚠️ 的店資料較舊或位置概略，出發前請用地圖連結確認；價格僅供參考。</div><div class="notice">🍰 <b>你這趟必吃的甜點：</b>1/6 前後是三王節，麵包店會賣 <b>Tortell de Reis（國王蛋糕，內藏小驚喜）</b>；另外別錯過 <b>Xuixo</b>（炸卡士達捲）、<b>Crema catalana</b>（加泰隆尼亞烤布蕾）、<b>Mel i Mató</b>（鮮乳酪淋蜂蜜）、<b>Churros 配熱巧克力</b>（見咖啡分類的 Granja 店）。</div>`;
  const list=EATS.filter(e=>(eatC==='all'||e.cat===eatC)&&(eatA==='all'||e.near===eatA));
  EAREA_ORDER.forEach(k=>{const it=list.filter(e=>e.near===k).sort((a,b)=>a.p-b.p);if(!it.length)return;h+=`<div class="sec">${AREA[k]}</div>`+it.map(eatCard).join('');});
  list.forEach(e=>{const m=L.marker([e.lat,e.lng],{icon:pin(CATCOL[e.cat],e.ic)}).addTo(layer).bindPopup(`<b>${e.n}</b><br>${e.why}`);m.on('click',()=>sel(e.id));mk[e.id]=m;pts.push([e.lat,e.lng]);});
 }
 side.innerHTML=h;
 side.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(tab===1)dayF=+b.dataset.d;else if(tab===2)anchF=b.dataset.a;else{if(b.dataset.c)eatC=b.dataset.c;if(b.dataset.a2)eatA=b.dataset.a2;}render()});
 side.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.tagName==='A')return;sel(c.dataset.id,true)});
 const useful=pts.filter((p,i)=>i>0||pts.length===1);
 if(tab===1&&dayF===0){map.setView([41.3925,2.165],11)} else if(useful.length){map.fitBounds(L.latLngBounds(pts).pad(.25),{maxZoom:14})}
 setTimeout(()=>map.invalidateSize(),50);
 if(typeof syncGoogle==='function'&&gm.style.display!=='none'&&!curSelKeep){curSel=null;syncGoogle()}
}
const gm=document.getElementById('gm');
const embed=q=>gm.src='https://maps.google.com/maps?hl='+LANG+'&z=15&output=embed&q='+encodeURIComponent(q);
const embedRoute=(stops)=>gm.src='https://maps.google.com/maps?hl='+LANG+'&output=embed&dirflg=r&saddr='+encodeURIComponent('Plaça de Catalunya, Barcelona')+'&daddr='+stops.map(encodeURIComponent).join('+to:');
const findObj=id=>FIX.find(x=>x.id===id)||PICKS.find(x=>x.id===id)||EATS.find(x=>x.id===id);
function dayRouteUrl(d){const fx=FIX.filter(f=>f.day===d).sort((a,b)=>a.ord-b.ord);if(!fx.length)return null;
 const last=fx[fx.length-1],wp=fx.slice(0,-1).map(f=>f.lat+','+f.lng).join('|');
 return `https://www.google.com/maps/dir/?api=1&hl=${LANG}&travelmode=transit&origin=${encodeURIComponent('Plaça de Catalunya Barcelona')}&destination=${last.lat},${last.lng}`+(wp?`&waypoints=${encodeURIComponent(wp)}`:'');}
function showGoogle(){document.getElementById('map').style.display='none';gm.style.display='block';mG.classList.add('on');mO.classList.remove('on')}
function showOverview(){gm.style.display='none';document.getElementById('map').style.display='block';mO.classList.add('on');mG.classList.remove('on');setTimeout(()=>map.invalidateSize(),50)}
const mG=document.getElementById('mG'),mO=document.getElementById('mO');
mG.onclick=showGoogle;mO.onclick=showOverview;
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;document.querySelectorAll('#lg button').forEach(x=>x.classList.toggle('on',x===b));render();syncGoogle()});
let curSel=null;
function syncGoogle(){const o=curSel&&findObj(curSel);if(o)embed((o.en||o.n)+' '+o.addr+' Barcelona');else if(tab===1&&dayF){const fx=FIX.filter(f=>f.day===dayF).sort((a,b)=>a.ord-b.ord);if(fx.length)embedRoute(fx.map(f=>f.lat+','+f.lng));else embed('Plaça de Catalunya Barcelona')}else embed('Plaça de Catalunya Barcelona');}
function sel(id,fly){curSel=id;if(gm.style.display!=='none')syncGoogle();
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
 const el=document.querySelector(`.card[data-id="${id}"]`); if(el&&!fly)el.scrollIntoView({behavior:'smooth',block:'center'});
 const m=mk[id]; if(m){ if(fly)map.flyTo(m.getLatLng(),14); m.openPopup(); }
}
const TB=[t1,t2,t3];
function goTab(n){tab=n;TB.forEach((b,i)=>b.classList.toggle('on',i===n-1));curSel=null;render();syncGoogle()}
t1.onclick=()=>goTab(1);t2.onclick=()=>goTab(2);t3.onclick=()=>goTab(3);
render();syncGoogle();
</script>
</body>
</html>
