<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅遊行程地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1c1b1a;--mut:#74706a;--line:#e7e2da;--brand:#ff5a36;--pill:#efeae2;--shadow:0 4px 16px rgba(40,30,20,.08);--nav:58px}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--card:#221f1c;--ink:#f3eee8;--mut:#a9a199;--line:#37322d;--pill:#2f2a26;--shadow:0 4px 16px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- 頂欄 ---------- */
.top{position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;white-space:nowrap}.logo span{color:var(--brand)}
.dtabs{display:flex;gap:4px;background:var(--pill);padding:3px;border-radius:99px;margin-left:8px}
.dtabs button,.nav button{border:0;background:transparent}
.dtabs button{padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px}
.dtabs button.on{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:40px;padding:0 12px;font-size:14px;font-weight:600}
.menu{position:absolute;right:10px;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;width:min(320px,calc(100vw - 20px));display:none}
.menu.open{display:block}
.menu h4{margin:6px 0 6px;font-size:13px;color:var(--mut)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu a.lk{display:block;padding:10px 4px;border-top:1px solid var(--line);margin-top:8px;font-weight:600}
.menu .note{font-size:12.5px;color:var(--mut);margin-top:6px}
/* ---------- 版面 ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,520px) 1fr}
.app.nomap{grid-template-columns:1fr}
.app.nomap .mapwrap{display:none}
.side{overflow-y:auto;padding:0 14px 90px;-webkit-overflow-scrolling:touch}
.app.nomap .side{max-width:880px;width:100%;margin:0 auto}
.mapwrap{display:flex;flex-direction:column;min-height:0;background:var(--card);border-left:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.mhead .chip{min-height:34px}
.mhead .x{margin-left:auto;display:none}
#gm{width:100%;flex:1;border:0;min-height:200px;background:var(--pill)}
#map{flex:1;min-height:200px;display:none}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px}
/* ---------- chips ---------- */
.chips{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:99px;font-size:13.5px;min-height:38px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mhead .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hint{font-size:12.5px;color:var(--mut);margin:4px 2px 10px}
/* ---------- 日程 ---------- */
.day{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.dh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;min-height:60px}
.dnum{flex:none;width:44px;height:44px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.dnum small{font-size:10px;font-weight:600;opacity:.9}
.dt{flex:1;min-width:0}.dt b{display:block;font-size:15.5px}.dt em{display:block;font-style:normal;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;transition:.2s;color:var(--mut)}
.open>.dh .chev,.open>.ach .chev{transform:rotate(180deg)}
.db{display:none;padding:0 14px 14px}
.day.open .db{display:block}
.dtxt{font-size:14px;color:var(--mut);margin:0 0 8px}
.tl{position:relative;margin:6px 0 4px 8px;padding-left:22px;border-left:3px solid var(--line)}
.tl>.stop{position:relative;margin:0 0 10px}
.tl>.stop::before{content:"";position:absolute;left:-33px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--c,var(--brand));border:3px solid var(--card)}
.near{margin:6px 0 4px}
.nh{font-size:12.5px;font-weight:700;color:var(--mut);margin:8px 0 5px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.mini{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:132px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left}
.mini .e{font-size:22px;line-height:1}
.mini b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini i{font-style:normal;font-size:11.5px;color:var(--mut)}
.rt{display:inline-flex;align-items:center;gap:6px;margin:4px 0 6px;font-weight:700;font-size:13.5px}
/* ---------- 可展開卡片 ---------- */
.ac{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin:0 0 10px;border:2px solid transparent;overflow:hidden}
.ac.sel{border-color:var(--brand)}
.ach{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;min-height:60px}
.ico{flex:none;width:44px;height:44px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:15px;line-height:1.3}
.tt small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt em{display:block;font-style:normal;font-size:12.5px;color:var(--mut)}
.acb{display:none;padding:0 12px 12px}
.ac.open .acb{display:block}
.acb p{margin:6px 0;font-size:14px}
.row{font-size:13px;color:var(--mut);margin:3px 0}
.meta{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;background:var(--pill);padding:2px 9px;border-radius:99px}
.tag.warn{background:#fff2c9;color:#7a5a00}.tag.ok{background:#d9f2e0;color:#14642d}
@media(prefers-color-scheme:dark){.tag.warn{background:#4a3d12;color:#ffe08a}.tag.ok{background:#173d24;color:#9ee6b3}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.info{background:var(--pill);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13px;line-height:1.55}.info div{margin:2px 0}
.sd{display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;margin-right:6px;border:2px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mini .sd{position:absolute;top:8px;right:8px;margin:0}
.mini{position:relative}
.tag.opt{background:#dbe9ff;color:#1f4f99}
.tag.mine{background:#ffe3d6;color:#a2391a}
@media(prefers-color-scheme:dark){.tag.opt{background:#1d3250;color:#a9cdfc}.tag.mine{background:#4a2a1c;color:#ffc4aa}}
.adv{background:#fff7e0;border:1px solid #f1d68a;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;line-height:1.6;color:#4a3b00}
@media(prefers-color-scheme:dark){.adv{background:#3a3213;border-color:#6b5a1d;color:#ffe9a8}}
.adv b{color:inherit}
.todo{background:var(--pill);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}
.todo b{display:block;margin-bottom:2px}
.todo label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;line-height:1.45}
.todo input{margin-top:3px;flex:none}
.wx{background:#e6f3ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px;line-height:1.6;color:#13365c}
@media(prefers-color-scheme:dark){.wx{background:#16293d;color:#bcd8f5}}
.wx div{margin:2px 0}
.wxall{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:2px 12px;margin:0 0 12px}
.wxall summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.wxall p{margin:6px 0;font-size:13.5px}
.wxall a{font-weight:600}
.sec{margin:16px 2px 8px;font-weight:800;font-size:15px}
.notice{font-size:12.5px;color:var(--mut);margin:12px 2px;line-height:1.55}
/* ---------- 手機 ---------- */
.nav{display:none}
@media(max-width:820px){
 .dtabs,#mapToggle{display:none}
 .app{grid-template-columns:1fr}
 .side{padding-bottom:calc(var(--nav) + 90px)}
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--line)}
 .nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;color:var(--mut)}
 .nav button span{font-size:20px;line-height:1}
 .nav button.on{color:var(--brand);font-weight:700}
 .mapwrap{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));height:62vh;z-index:25;border-radius:20px 20px 0 0;border:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(120%);transition:transform .25s}
 .mapwrap.open{transform:translateY(0)}
 .app.nomap .mapwrap{display:flex}
 .mhead .x{display:inline-flex}
 .mhead #mHint{display:none}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo"></div>
  <div class="dtabs" id="dtabs"><button data-t="1" class="on">📅 每日行程</button><button data-t="2">🔗 順路搭配</button><button data-t="3">🍴 美食補給</button></div>
  <div class="sp"></div>
  <button class="ib" id="mapToggle">🗺️ 隱藏地圖</button>
  <button class="ib" id="menuBtn" aria-expanded="false">☰ 選單</button>
  <div class="menu" id="menu">
    <h4>地圖語言 / Map language</h4>
    <div class="seg" id="lg"><button data-l="zh-TW" class="on">中文</button><button data-l="en">English</button></div>
    <a class="lk" href="food.html">🍽️ 完整餐廳／購物／市集／爵士清單 →</a>
    <a class="lk" href="safety.html">🛡️ 治安地圖（2026 下半年）→</a>
    <a class="lk" href="phrases.html">🗣️ 西班牙文小筆記（含發音）→</a>
    <div class="note" id="hdrNote"></div>
    <div class="note">圓點 🔴🟠🟢 是該地點所在區域的治安燈號（概略），詳見治安地圖；不代表單一店家。</div>
    <div class="note">營業時間與票價以官網為準；標 ⚠️ 的項目請出發前確認。</div>
  </div>
</div>

<div class="app" id="app">
  <div class="side" id="side"></div>
  <div class="mapwrap" id="mapwrap">
    <div class="mhead"><button class="chip on" id="mG">Google 地圖</button><button class="chip" id="mO">總覽</button><span id="mHint" style="color:var(--mut)">點「在地圖看」定位</span><button class="chip x" id="mClose">✕ 收合</button></div>
    <iframe id="gm" title="Google Maps" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    <div id="map"></div>
  </div>
</div>

<nav class="nav" id="nav">
  <button data-t="1" class="on"><span>📅</span>行程</button>
  <button data-t="2"><span>🔗</span>順路</button>
  <button data-t="3"><span>🍴</span>美食</button>
  <button id="navMap"><span>🗺️</span>地圖</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="zones.js"></script>
<script>
document.title=CONFIG.title;document.querySelector('.logo').innerHTML=CONFIG.logoHtml;document.getElementById('hdrNote').textContent=CONFIG.headerNote;
let LANG='zh-TW',tab=1,dayF=0,anchF='all',eatC='all',eatA='all',curSel=null,openId=null,sheetOpen=false,mapHidden=false;
const openDays=new Set([1]);
let TD={};try{TD=JSON.parse(localStorage.getItem('trip-todo')||'{}')}catch(e){}
document.addEventListener('change',e=>{const c=e.target.closest&&e.target.closest('[data-td]');if(c){TD[c.dataset.td]=c.checked;try{localStorage.setItem('trip-todo',JSON.stringify(TD))}catch(x){}}});
const mob=()=>matchMedia('(max-width:820px)').matches;
const $=id=>document.getElementById(id);
const maps=(n,a)=>'https://www.google.com/maps/search/?api=1&hl='+LANG+'&query='+encodeURIComponent(n+' '+(a||'')+' '+CONFIG.city);
const dir=(lat,lng)=>`https://www.google.com/maps/dir/?api=1&hl=${LANG}&origin=${encodeURIComponent(CONFIG.startQuery)}&destination=${lat},${lng}&travelmode=transit`;
const CATLBL={all:'全部',super:'🛒 超市',coffee:'☕ 咖啡',eat:'🥐 小吃·午餐',sweet:'🍰 必吃甜點',paella:'🥘 海鮮飯',churros:'🥖 吉拿棒',crema:'🍮 加泰布蕾'};
const CATCOL={super:'#2e7d32',coffee:'#6d4c41',eat:'#e63946',sweet:'#d81b60',paella:'#0d7fa5',churros:'#c26a1b',crema:'#a1458f'};
const PLE={1:'💲 省',2:'💲💲 中',3:'💲💲💲 偏高'};
const AREAOF={batllo:'batllo',milà:'batllo',guell:'guell',sagrada:'sagrada',fireareis:'fireareis',montserrat:'montserrat',dali:'dali',nadalport:'port'};
const findObj=id=>FIX.find(x=>x.id===id)||PICKS.find(x=>x.id===id)||EATS.find(x=>x.id===id);
const dayStr=d=>DATES[d-1].split(' ');
const short=s=>s.split('（')[0].split(' (')[0];

/* ----- 地圖 ----- */
const map=L.map('map',{zoomControl:true}).setView(CONFIG.mapCenter,CONFIG.mapZoom);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);let mk={};
const pin=(c,t)=>L.divIcon({className:'',html:`<div class="pin" style="background:${c}"><span>${t}</span></div>`,iconSize:[30,30],iconAnchor:[15,30]});
L.marker([HOTEL.lat,HOTEL.lng],{icon:L.divIcon({className:'',html:'<div style="font-size:24px">📍</div>',iconSize:[24,24],iconAnchor:[12,24]})}).addTo(map).bindPopup('<b>出發點 '+HOTEL.n+'</b>');
const gm=$('gm');
const embed=q=>{gm.src='https://maps.google.com/maps?hl='+LANG+'&z=15&output=embed&q='+encodeURIComponent(q)};
const embedRoute=st=>{gm.src='https://maps.google.com/maps?hl='+LANG+'&output=embed&dirflg=r&saddr='+encodeURIComponent(CONFIG.startQuery)+'&daddr='+st.map(encodeURIComponent).join('+to:')};
function dayRouteUrl(d){const fx=FIX.filter(f=>f.day===d&&f.r!==0).sort((a,b)=>a.ord-b.ord);if(!fx.length)return null;
 const last=fx[fx.length-1],wp=fx.slice(0,-1).map(f=>f.lat+','+f.lng).join('|');
 return `https://www.google.com/maps/dir/?api=1&hl=${LANG}&travelmode=transit&origin=${encodeURIComponent(CONFIG.startQuery)}&destination=${last.lat},${last.lng}`+(wp?`&waypoints=${encodeURIComponent(wp)}`:'');}
const mapVisible=()=>mob()?sheetOpen:!mapHidden;
function syncGoogle(){
 if(!mapVisible())return;
 const o=curSel&&findObj(curSel);
 if(o)embed((o.en||o.n)+' '+o.addr+' '+CONFIG.city);
 else if(tab===1&&dayF){const fx=FIX.filter(f=>f.day===dayF&&f.r!==0).sort((a,b)=>a.ord-b.ord);fx.length?embedRoute(fx.map(f=>f.lat+','+f.lng)):embed(CONFIG.startQuery)}
 else embed(CONFIG.startQuery);
}
function showMode(g){gm.style.display=g?'block':'none';$('map').style.display=g?'none':'block';$('mG').classList.toggle('on',g);$('mO').classList.toggle('on',!g);if(!g)setTimeout(()=>map.invalidateSize(),60)}
function openSheet(v){
 sheetOpen=v;$('mapwrap').classList.toggle('open',v);$('navMap').classList.toggle('on',v);
 if(v){syncGoogle();setTimeout(()=>map.invalidateSize(),260)}
}
function setMapHidden(h){mapHidden=h;$('app').classList.toggle('nomap',h);$('mapToggle').textContent=h?'🗺️ 顯示地圖':'🗺️ 隱藏地圖';if(!h){syncGoogle();setTimeout(()=>map.invalidateSize(),60)}}

/* ----- 元件 ----- */
const links=o=>`<a class="btn" target="_blank" rel="noopener" href="${o.gm||maps(o.en||o.n,o.addr)}">${o.gm?'📌 你的地圖連結 ↗':'Google 地圖 ↗'}</a><a class="btn" target="_blank" rel="noopener" href="${dir(o.lat,o.lng)}">🧭 大眾運輸路線</a>${o.link?`<a class="btn" target="_blank" rel="noopener" href="${o.link}">🔗 官網</a>`:''}`;
const SAFE_COL={red:'#d93a3a',ora:'#ee8a1f',grn:'#2e9b57'};
const SAFE_RANK={red:3,ora:2,grn:1};
const SAFE_OVR={espanyol:'ora',montserrat:'grn',dali:'grn'};
function inPoly(lat,lng,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c}return c}
function distM(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);const q=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function safetyOf(o){
 if(SAFE_OVR[o.id])return SAFE_OVR[o.id];
 let best='grn';
 for(const z of ZONES){const hit=z.poly?inPoly(o.lat,o.lng,z.poly):distM(o.lat,o.lng,z.circle[0],z.circle[1])<=z.circle[2];if(hit&&SAFE_RANK[z.lv]>SAFE_RANK[best])best=z.lv}
 return best;
}
const dotH=o=>`<i class="sd" style="background:${SAFE_COL[safetyOf(o)]}"></i>`;
const EST={1:'約 €8–15／人（估計）',2:'約 €15–30／人（估計）',3:'約 €30 以上／人（估計）'};
function priceOf(o){if(o.price)return o.price;if(o.near){if(o.cat==='coffee')return '咖啡約 €2–4／杯（估計）';if(o.cat==='sweet')return '甜點約 €3–7／份（估計）';if(o.cat==='super')return '依購買內容';return EST[o.p]||'請看店家'}return '請查官網'}
function hoursOf(o){return o.hours||'未查到確切時間，請看 Google 地圖（冬季與節日常縮短，1/1、1/6 可能休息）'}
const infoH=o=>`<div class="info"><div>⏰ <b>營業時間</b>：${hoursOf(o)}</div><div>💶 <b>價位</b>：${priceOf(o)}</div></div>`;
function acc(o){
 return `<div class="ac ${openId===o.id?'open':''} ${curSel===o.id?'sel':''}" data-id="${o.id}"><button class="ach" data-acc="${o.id}"><span class="ico" style="background:${o.col}">${o.ic}</span><span class="tt"><b>${dotH(o.obj)}${o.t}</b><small>${o.en||''}</small><em>${o.sub||''}</em></span><span class="chev">▾</span></button>
 <div class="acb">${o.meta?`<div class="meta">${o.meta}</div>`:''}${o.body}${infoH(o.obj)}<div class="acts"><button class="btn pri" data-map="${o.id}">🗺️ 在地圖看</button>${links(o.obj)}</div></div></div>`;
}
const tagH=(t,c)=>`<span class="tag ${c||''}">${t}</span>`;
function fixAcc(f){
 return acc({id:f.id,ic:f.ic,col:DAYCOL[f.day-1],t:f.n,en:f.en,sub:'🕘 '+f.time,obj:f,
  meta:(f.opt?tagH(f.opt,'opt'):'')+f.tags.map(t=>tagH(t,'ok')).join('')+(f.warn||[]).map(t=>tagH('⚠️ '+t,'warn')).join(''),
  body:`<p>${f.d}</p><div class="row">🚇 ${f.tr}</div>`});
}
function pickAcc(p){
 return acc({id:p.id,ic:p.ic,col:DAYCOL[(p.day||1)-1],t:p.n,en:p.en,sub:p.cat+' · 建議 '+dayStr(p.day)[0],obj:p,
  meta:p.with.map(w=>tagH('配 '+ANCH[w],'ok')).join('')+(p.warn?tagH('⚠️ 請確認營業','warn'):''),
  body:`<p>${p.why}</p><div class="row">🚇 ${p.tr}</div>`});
}
function eatAcc(e){
 return acc({id:e.id,ic:e.ic,col:CATCOL[e.cat],t:e.n,en:e.en,sub:CATLBL[e.cat]+' · '+PLE[e.p],obj:e,
  meta:(e.mine?tagH('⭐ 你的行程','mine'):'')+tagH(AREA[e.near])+(e.warn?tagH('⚠️ 請確認營業／位置','warn'):''),
  body:`<p>${e.why}</p>`});
}
const mini=(o,price)=>`<button class="mini" data-map="${o.id}">${dotH(o)}<span class="e">${o.ic}</span><b>${short(o.n)}</b><i>${price||''}</i></button>`;
function nearHtml(f,shown){
 const area=f.area;let h='';
 const eats=(area&&!shown.has(area))?EATS.filter(e=>e.near===area&&e.cat!=='super'&&!e.mine).sort((a,b)=>a.p-b.p).slice(0,14):[];
 if(area)shown.add(area);
 const picks=PICKS.filter(p=>p.with[0]===f.id);
 if(picks.length)h+=`<div class="nh">🎯 順路可玩／逛</div><div class="scroll">${picks.map(p=>mini(p,p.cat)).join('')}</div>`;
 if(eats.length)h+=`<div class="nh">🍴 附近吃喝（價位低→高）</div><div class="scroll">${eats.map(e=>mini(e,PLE[e.p])).join('')}</div>`;
 return h?`<div class="near">${h}</div>`:'';
}

/* ----- 渲染 ----- */
function render(){
 layer.clearLayers();mk={};
 let h='';const pts=[[HOTEL.lat,HOTEL.lng]];
 const addMk=(o,ic,col)=>{const m=L.marker([o.lat,o.lng],{icon:pin(col,ic)}).addTo(layer).bindPopup(`<b>${o.n}</b>`);m.on('click',()=>sel(o.id));mk[o.id]=m;pts.push([o.lat,o.lng]);};
 if(tab===1){
  h+=`<div class="chips"><button class="chip ${dayF===0?'on':''}" data-d="0">全部</button>${DATES.map((d,i)=>`<button class="chip ${dayF===i+1?'on':''}" data-d="${i+1}">${d}</button>`).join('')}</div>`;
  h+=(typeof WX_NOTE!=='undefined')?`<details class="wxall"><summary>🌤️ 天氣與穿搭總覽（1 月氣候平均）</summary><p>${WX_NOTE}</p><p>🌡️ 巴塞隆納 1 月：白天約 13–15°C、夜晚約 4–7°C；日照約 4 小時／天；降雨偏少但來源差異大（3–13 天／月）。</p><p>🧥 <b>建議帶：</b>發熱衣、毛衣或刷毛、防風防潑水外套（輕羽絨更好）、圍巾、帽子、薄手套（遊行、Montserrat、夜間用）、折疊傘、舒適防滑鞋、暖暖包。洋蔥式穿法最實用。</p><p>🔗 預報：<a target="_blank" rel="noopener" href="https://www.aemet.es/es/eltiempo/prediccion/municipios/barcelona-id08019">AEMET 巴塞隆納</a>｜<a target="_blank" rel="noopener" href="https://www.meteo.cat/">Meteocat</a>｜<a target="_blank" rel="noopener" href="https://www.windy.com/41.385/2.173">Windy 風速圖</a></p></details>`:'';
  const days=dayF?[DAYS[dayF-1]]:DAYS;
  for(const D of days){
   const fx=FIX.filter(f=>f.day===D.d).sort((a,b)=>a.ord-b.ord);
   const isOpen=dayF?true:openDays.has(D.d);
   const shown=new Set();let body='';
   body+=`<p class="dtxt">${D.s}</p>`;
   if(typeof WX!=='undefined'&&WX[D.d]){const w=WX[D.d];body+=`<div class="wx"><b>🌤️ 天氣預估（氣候平均）</b><div>🌡️ ${w.t}</div><div>🌧️ ${w.r}</div><div>🌬️ ${w.w}</div><div>👕 <b>穿搭：</b>${w.c}</div></div>`;}
   if(D.adv)body+=`<div class="adv"><b>💡 重點與建議</b><br>${D.adv.replace(/\n/g,'<br>')}</div>`;
   if(D.todo&&D.todo.length)body+=`<div class="todo"><b>✅ 出發前待辦</b>${D.todo.map((t,i)=>`<label><input type="checkbox" data-td="${D.d}-${i}" ${TD[D.d+'-'+i]?'checked':''}><span>${t}</span></label>`).join('')}</div>`;
   const rt=dayRouteUrl(D.d);if(rt)body+=`<a class="rt" target="_blank" rel="noopener" href="${rt}">🧭 當日大眾運輸路線（Google 地圖）</a>`;
   if(fx.length){body+=`<div class="tl">`+fx.map(f=>`<div class="stop" style="--c:${DAYCOL[D.d-1]}">${fixAcc(f)}${nearHtml(f,shown)}</div>`).join('')+`</div>`;}
   const free=PICKS.filter(p=>p.day===D.d&&p.with[0]==='free');
   if(free.length)body+=`<div class="near"><div class="nh">🎯 今日推薦</div><div class="scroll">${free.map(p=>mini(p,p.cat)).join('')}</div></div>`;
   const ar=(DAYAREA[D.d]||[]).filter(a=>!shown.has(a));
   const es=EATS.filter(e=>ar.includes(e.near)&&e.cat!=='super'&&!e.mine).sort((a,b)=>a.p-b.p).slice(0,14);
   if(es.length)body+=`<div class="near"><div class="nh">🍴 今日順路吃喝</div><div class="scroll">${es.map(e=>mini(e,PLE[e.p])).join('')}</div></div>`;
   const sights=D.k||fx.map(f=>short(f.n)).join('、')||'機動日';
   h+=`<div class="day ${isOpen?'open':''}" data-day="${D.d}"><button class="dh" data-dayt="${D.d}"><span class="dnum" style="background:${DAYCOL[D.d-1]}">${D.d}<small>${dayStr(D.d)[0]}</small></span><span class="dt"><b>${D.t}</b><em>${dayStr(D.d)[1]}｜${sights}</em></span><span class="chev">▾</span></button><div class="db">${body}</div></div>`;
   fx.forEach(f=>addMk(f,D.d,DAYCOL[D.d-1]));
  }
  h+=`<p class="notice">⚠️ 營業時間、票價與班次依官網為準。點橫向小卡片可在地圖看位置；插圖為 emoji，未使用實景照。</p>`;
 }else if(tab===2){
  h+=`<div class="chips"><button class="chip ${anchF==='all'?'on':''}" data-a="all">全部</button>${Object.keys(ANCH).map(k=>`<button class="chip ${anchF===k?'on':''}" data-a="${k}">${ANCH[k]}</button>`).join('')}</div>`;
  h+=`<p class="hint">書本推薦地點（高價位已刪除）配合哪個確定景點一起排。點卡片展開細節。</p>`;
  Object.keys(ANCH).filter(k=>anchF==='all'||k===anchF).forEach(k=>{
   const f=FIX.find(x=>x.id===k);if(f)addMk(f,'★','#ff3b6b');
   const items=PICKS.filter(p=>p.with[0]===k);if(!items.length)return;
   h+=`<div class="sec">★ ${ANCH[k]} 周邊／順路</div>`+items.map(pickAcc).join('');
   items.forEach(p=>addMk(p,p.ic,DAYCOL[p.day-1]));
  });
 }else{
  h+=`<div class="chips">${Object.keys(CATLBL).map(k=>`<button class="chip ${eatC===k?'on':''}" data-c="${k}">${CATLBL[k]}</button>`).join('')}</div>`;
  h+=`<div class="chips" style="top:46px"><button class="chip ${eatA==='all'?'on':''}" data-a2="all">全部地區</button>${EAREA_ORDER.map(k=>`<button class="chip ${eatA===k?'on':''}" data-a2="${k}">${AREA[k]}</button>`).join('')}</div>`;
  h+=`<p class="notice">🛒 週日與國定假日多數超市休息，建議事先買好水與早餐。🍰 三王節前後有 Tortell de Reis（國王蛋糕），也別錯過 Xuixo、Crema catalana、Churros。各區內依價位低→高；價位為估計，標 ⚠️ 請出發前確認。</p>`;
  const list=EATS.filter(e=>(eatC==='all'||e.cat===eatC)&&(eatA==='all'||e.near===eatA));
  EAREA_ORDER.forEach(k=>{const it=list.filter(e=>e.near===k).sort((a,b)=>a.p-b.p);if(!it.length)return;h+=`<div class="sec">${AREA[k]}</div>`+it.map(eatAcc).join('');it.forEach(e=>addMk(e,e.ic,CATCOL[e.cat]));});
 }
 $('side').innerHTML=h;
 if(tab===1&&dayF===0)map.setView(CONFIG.mapCenter,CONFIG.mapZoomAll||11);
 else if(pts.length>1)map.fitBounds(L.latLngBounds(pts).pad(.25),{maxZoom:14});
}

/* ----- 互動 ----- */
function sel(id){
 curSel=id;
 if(!mk[id]){const o=findObj(id);if(o){const m=L.marker([o.lat,o.lng],{icon:pin('#ff3b6b',o.ic||'★')}).addTo(layer).bindPopup(`<b>${o.n}</b>`);mk[id]=m}}
 document.querySelectorAll('.ac').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
 if(mob()&&!sheetOpen)openSheet(true);else syncGoogle();
 const m=mk[id];if(m){setTimeout(()=>{map.flyTo(m.getLatLng(),14);m.openPopup()},280)}
}
$('side').addEventListener('click',e=>{
 const t=e.target.closest('[data-d],[data-a],[data-c],[data-a2],[data-acc],[data-map],[data-dayt]');if(!t)return;
 if(t.dataset.map){e.preventDefault();sel(t.dataset.map);return}
 if(t.dataset.acc){const ac=t.closest('.ac');const was=ac.classList.contains('open');document.querySelectorAll('.ac.open').forEach(x=>x.classList.remove('open'));if(!was){ac.classList.add('open');openId=t.dataset.acc}else openId=null;return}
 if(t.dataset.dayt){const d=+t.dataset.dayt;const el=t.closest('.day');el.classList.toggle('open');el.classList.contains('open')?openDays.add(d):openDays.delete(d);return}
 if(t.dataset.d!==undefined){dayF=+t.dataset.d;if(dayF)openDays.add(dayF);curSel=null}
 else if(t.dataset.a!==undefined)anchF=t.dataset.a;
 else if(t.dataset.c)eatC=t.dataset.c;
 else if(t.dataset.a2)eatA=t.dataset.a2;
 render();$('side').scrollTop=0;syncGoogle();
});
function goTab(n){tab=n;curSel=null;openId=null;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===n));render();$('side').scrollTop=0;syncGoogle()}
document.querySelectorAll('#dtabs [data-t],#nav [data-t]').forEach(b=>b.onclick=()=>goTab(+b.dataset.t));
$('navMap').onclick=()=>openSheet(!sheetOpen);
$('mClose').onclick=()=>openSheet(false);
$('mapToggle').onclick=()=>setMapHidden(!mapHidden);
$('mG').onclick=()=>showMode(true);$('mO').onclick=()=>showMode(false);
const menu=$('menu');$('menuBtn').onclick=e=>{e.stopPropagation();const o=menu.classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==$('menuBtn'))menu.classList.remove('open')});
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;document.querySelectorAll('#lg button').forEach(x=>x.classList.toggle('on',x===b));render();syncGoogle()});
matchMedia('(max-width:820px)').addEventListener('change',()=>{sheetOpen=false;$('mapwrap').classList.remove('open');$('navMap').classList.remove('on');syncGoogle();setTimeout(()=>map.invalidateSize(),100)});
render();syncGoogle();
</script>
</body>
</html>
